        <rect x="5" y="55" width="5" height="5" /><rect x="15" y="55" width="5" height="5" /><rect x="25" y="55" width="5" height="5" /><rect x="35" y="55" width="5" height="5" /><rect x="45" y="55" width="5" height="5" /><rect x="55" y="55" width="5" height="5" />
