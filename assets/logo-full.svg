  <!-- Emblema à esquerda -->
  <rect width="60" height="60" fill="#C8975D" mask="url(#noxxd-full-mask)" />
  
  <!-- Marca NOXXD -->
  <text x="74" y="35" font-family="'Oswald', 'Archivo Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="32" fill="#C8975D" letter-spacing="0.08em">NOXXD</text>
  
