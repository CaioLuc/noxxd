<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Emblema NOXXD">
  <defs>
    <mask id="noxxd-emblem-mask">
      <!-- Fundo preto da máscara (oculto) -->
      <rect width="120" height="120" fill="black" />
      
      <!-- Quadrado Central Sólido (Branco = visível) -->
      <rect x="20" y="20" width="80" height="80" fill="white" />
      
      <!-- 40 Blocos de Borda Xadrez Pixelada (10x10 cada) -->
      <g fill="white">
        <!-- Linha 0 (y=0) -->
        <rect x="0" y="0" width="10" height="10" />
        <rect x="20" y="0" width="10" height="10" />
        <rect x="40" y="0" width="10" height="10" />
        <rect x="60" y="0" width="10" height="10" />
        <rect x="80" y="0" width="10" height="10" />
        <rect x="100" y="0" width="10" height="10" />
        
        <!-- Linha 1 (y=10) -->
        <rect x="10" y="10" width="10" height="10" />
        <rect x="30" y="10" width="10" height="10" />
        <rect x="50" y="10" width="10" height="10" />
        <rect x="70" y="10" width="10" height="10" />
        <rect x="90" y="10" width="10" height="10" />
        <rect x="110" y="10" width="10" height="10" />
        
        <!-- Laterais Linhas 2 a 9 (y=20 a 90, colunas x=0 e x=100) -->
        <rect x="0" y="20" width="10" height="10" /><rect x="100" y="20" width="10" height="10" />
        <rect x="10" y="30" width="10" height="10" /><rect x="110" y="30" width="10" height="10" />
        <rect x="0" y="40" width="10" height="10" /><rect x="100" y="40" width="10" height="10" />
        <rect x="10" y="50" width="10" height="10" /><rect x="110" y="50" width="10" height="10" />
        <rect x="0" y="60" width="10" height="10" /><rect x="100" y="60" width="10" height="10" />
        <rect x="10" y="70" width="10" height="10" /><rect x="110" y="70" width="10" height="10" />
        <rect x="0" y="80" width="10" height="10" /><rect x="100" y="80" width="10" height="10" />
        <rect x="10" y="90" width="10" height="10" /><rect x="110" y="90" width="10" height="10" />
        
        <!-- Linha 10 (y=100) -->
        <rect x="0" y="100" width="10" height="10" />
        <rect x="20" y="100" width="10" height="10" />
        <rect x="40" y="100" width="10" height="10" />
        <rect x="60" y="100" width="10" height="10" />
        <rect x="80" y="100" width="10" height="10" />
        <rect x="100" y="100" width="10" height="10" />
        
        <!-- Linha 11 (y=110) -->
        <rect x="10" y="110" width="10" height="10" />
        <rect x="30" y="110" width="10" height="10" />
        <rect x="50" y="110" width="10" height="10" />
        <rect x="70" y="110" width="10" height="10" />
        <rect x="90" y="110" width="10" height="10" />
        <rect x="110" y="110" width="10" height="10" />
      </g>
      
      <!-- Recorte Negativo da Letra 'N' (Preto na máscara = orifício transparente) -->
      <g fill="black">
        <rect x="45.5" y="38.5" width="7.8" height="43" />
        <rect x="66.7" y="38.5" width="7.8" height="43" />
        <polygon points="45.5,38.5 66.7,57.1 66.7,68.5 53.3,49.9" />
      </g>
    </mask>
  </defs>
  
  <!-- Pintura Dourada (#C8975D) aplicando a Máscara -->
  <rect width="120" height="120" fill="#C8975D" mask="url(#noxxd-emblem-mask)" />
</svg>
