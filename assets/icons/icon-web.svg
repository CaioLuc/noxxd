<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="#C8975D" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
  <!-- Janela de Navegador Técnica -->
  <rect x="4" y="6" width="40" height="36" />
  <line x1="4" y1="14" x2="44" y2="14" />
  <!-- Botões Pixelados Quadrados na barra de título -->
  <rect x="8" y="9" width="3" height="3" fill="#C8975D" stroke="none" />
  <rect x="14" y="9" width="3" height="3" fill="#C8975D" stroke="none" />
  <rect x="20" y="9" width="3" height="3" fill="#C8975D" stroke="none" />
  <!-- Área Hero de Conteúdo -->
  <rect x="8" y="18" width="32" height="10" stroke-dasharray="2 2" />
  <!-- Grid de Colunas inferiores -->
  <rect x="8" y="32" width="14" height="6" />
  <rect x="26" y="32" width="14" height="6" />
  <!-- Acento Pixelado de Canto -->
  <rect x="40" y="2" width="4" height="4" fill="#C8975D" stroke="none" />
</svg>
